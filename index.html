<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework Checker · Mr. Lovrien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9; --card:#ffffff; --ink:#152033; --ink2:#3a4558; --muted:#6b7487; --line:#e1e5ee; --line2:#cfd5e2;
  --brand:#1f4fbf; --brand-ink:#ffffff; --brand-soft:#eaf0fd; --navy:#13254d;
  --good:#17804a; --good-bg:#e5f5ec; --part:#9a6200; --part-bg:#fff4dc; --bad:#b83333; --bad-bg:#fdecec;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141d; --card:#171e2b; --ink:#e9edf5; --ink2:#c3cad8; --muted:#8e98ad; --line:#263044; --line2:#33405a;
    --brand:#7aa2ff; --brand-ink:#0b1220; --brand-soft:#1c2a4a; --navy:#0b1426;
    --good:#5fd394; --good-bg:#13342a; --part:#f3c562; --part-bg:#382c10; --bad:#f39494; --bad-bg:#3b1b1d;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,-apple-system,Segoe UI,sans-serif;font-size:17px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{background:var(--navy);color:#fff}
.topbar .in{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand{font-weight:600;font-size:1.05rem;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:.8rem;opacity:.75}
.topbar .who{margin-left:auto;font-size:.85rem;opacity:.85;text-align:right}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 48px}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-bottom:16px}
.crumbs button{background:none;border:none;padding:0;color:var(--brand);cursor:pointer;font-weight:500}
.crumbs .sep{opacity:.5}
h1{font-size:1.6rem;line-height:1.25;margin:0 0 4px}
h2{font-size:1.15rem;margin:0 0 14px}
.lead{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s, transform .15s}
.choice:hover,.choice:focus-visible{border-color:var(--brand);outline:none;transform:translateY(-1px)}
.choice .ic{width:44px;height:44px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.choice strong{display:block;font-size:1.05rem}
.choice span{color:var(--muted);font-size:.88rem}
.choice .go{margin-left:auto;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 16px}
/* homework header */
.hwhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.meta{color:var(--muted);font-size:.92rem}
.howto{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);color:var(--ink2);border-radius:12px;padding:12px 14px;font-size:.92rem;margin:16px 0 18px}
.howto b{color:var(--ink)}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin-bottom:6px}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.ptext{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:7px}
.ptext b{color:var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* problem */
.prob{padding:20px 20px 18px;margin-bottom:14px;scroll-margin-top:72px}
.ptop{display:flex;gap:14px;align-items:flex-start}
.num{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.95rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num{background:var(--brand-soft);color:var(--brand)}}
.q{margin:4px 0 0;color:var(--ink);font-size:1.02rem}
.fig{margin:14px 0 0 48px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:inline-block;max-width:calc(100% - 48px)}
.fig img{display:block;max-width:100%;height:auto;max-height:240px}
.answers{margin:16px 0 0 48px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.blank{display:flex;align-items:center;gap:8px;white-space:nowrap}
.blank .pre{font-weight:500;color:var(--ink2)}
.blank .post{font-weight:500;color:var(--ink2);margin-left:-4px}
.blank input{width:120px;padding:9px 11px;border:1.5px solid var(--line2);border-radius:10px;background:var(--bg);font-size:1rem}
.blank input.wide{width:170px}
.blank input:focus{outline:none;border-color:var(--brand);background:var(--card)}
.blank.ok input,.blank.ok .seg{border-color:var(--good)}
.blank.no input,.blank.no .seg{border-color:var(--bad)}
.seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:var(--bg);border:none;padding:9px 18px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1.5px solid var(--line2)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.note{margin:10px 0 0 48px;font-size:.85rem;color:var(--muted)}
.note.paper{margin-top:14px;background:var(--brand-soft);color:var(--ink2);border-radius:10px;padding:8px 12px;display:inline-block}
.foot{margin:16px 0 0 48px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--brand);color:var(--brand-ink);border:none;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line2)}
.btn.small{padding:7px 12px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line2)}
.result{display:none;align-items:center;gap:8px;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.93rem}
.result.show{display:inline-flex}
.result svg{width:18px;height:18px;flex:none}
.r-good{background:var(--good-bg);color:var(--good)}
.r-part{background:var(--part-bg);color:var(--part)}
.r-bad{background:var(--bad-bg);color:var(--bad)}
.r-empty{background:var(--brand-soft);color:var(--brand)}
.bottom{display:flex;gap:10px;justify-content:center;margin-top:18px}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px}
.previewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--part-bg);color:var(--part);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:500;font-size:.92rem}
@media (max-width:560px){
  .fig,.answers,.note,.foot{margin-left:0}
  .fig{max-width:100%}
  .prob{padding:16px}
  h1{font-size:1.35rem}
}
/* ===== teacher ===== */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.tab.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select,.tinput{font-size:.95rem;color:var(--ink);background:var(--bg);border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%}
.field textarea{resize:vertical}
.hwitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.hwitem:first-child{border-top:none}
.muted{color:var(--muted);font-size:.88rem}
.eprob{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg)}
.eprob .head{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:start}
.eparts{margin-top:10px}
.epart{display:grid;grid-template-columns:1fr 1fr 70px 110px 30px;gap:8px;margin-bottom:6px;align-items:center}
.epart.hd{font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:4px}
.x{background:none;border:none;color:var(--bad);font-size:1.3rem;cursor:pointer;line-height:1}
.efig{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.efig img{max-height:80px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
details summary{cursor:pointer;font-weight:600}
code{background:var(--brand-soft);padding:1px 5px;border-radius:5px;font-size:.88em}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}
@media (max-width:600px){
  .epart{grid-template-columns:1fr 1fr 30px}
  .epart .ep-post,.epart .ep-type{grid-column:span 1}
  .eprob .head{grid-template-columns:64px 1fr auto}
}
</style>
<script src="homework.js"></script>
</head>
<body>
<header class="topbar"><div class="in">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#13254d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
  <div class="brand">Homework Checker<small>Mr. Lovrien · 8th Grade Math</small></div>
  <div class="who" id="who"></div>
</div></header>
<div class="wrap">
  <main id="app"></main>
  <footer>Made by Mr. Lovrien 2026</footer>
</div>

<script id="core">
/* ===== Shared answer logic (used by student AND teacher side) ===== */
var HWC = (function(){
  var FRAC = {'½':'1/2','⅓':'1/3','⅔':'2/3','¼':'1/4','¾':'3/4','⅕':'1/5','⅖':'2/5','⅗':'3/5','⅘':'4/5','⅙':'1/6','⅚':'5/6','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};

  function cyrb53(str, seed){
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++){
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  function hash(salt, canon){ return cyrb53(salt + '|' + canon, 7); }

  function numCanon(v){
    var r = Math.round(v * 100) / 100;
    if (Object.is(r, -0)) r = 0;
    return 'n:' + r;
  }

  function canon(c){
    var s = String(c).toLowerCase().trim().replace(/\.$/, '');
    // mixed number like "1 1/2" or "-2 3/4"
    var m = s.match(/^(-?)\s*(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if (m && +m[4] !== 0) return numCanon((m[1] ? -1 : 1) * (+m[2] + (+m[3]) / (+m[4])));
    s = s.replace(/\bis\s+similar\s+to\b/g, '~').replace(/\btriangle\b/g, '');
    s = s.replace(/\s+/g, '');
    s = s.replace(/^answer:|^ans:/, '');
    s = s.replace(/^[a-z]\([^)]*\)=(?=.)/, '');    // f(x)=20x, h(-8)=-13 -> answer
    s = s.replace(/[△δ∆]/g, '').replace(/[∼≈]/g, '~');
    s = s.replace(/^m?∠[a-z]{1,3}=/, '');          // m∠A = 50 -> 50
    // similarity statement: ABC~EFD == BCA~FDE == EFD~ABC ...
    var sim = s.match(/^([a-z]{3})~([a-z]{3})$/);
    if (sim){
      var key = function(L, R){
        return [0,1,2].map(function(i){ return [L[i], R[i]]; })
          .sort(function(a, b){ return a[0] < b[0] ? -1 : 1; })
          .reduce(function(o, p){ o[0] += p[0]; o[1] += p[1]; return o; }, ['', '']).join('~');
      };
      var k1 = key(sim[1], sim[2]), k2 = key(sim[2], sim[1]);
      return 's:' + (k1 < k2 ? k1 : k2);
    }
    if (/^(yes|y|yessimilar|similar|theyaresimilar)$/.test(s)) return 't:yes';
    if (/^(no|n|nosimilar|notsimilar|theyarenotsimilar)$/.test(s)) return 't:no';
    s = s.replace(/^[a-z]=(?=.)/, '');          // x=4 -> 4
    s = s.replace(/^([^<>!]+?)=[a-z]$/, '$1');   // 4=x -> 4
    s = s.replace(/\$/g, '').replace(/°|degrees?$/g, '');
    // strip units: 12cm, 25%, 40ft², 3units
    s = s.replace(/^(-?\d*\.?\d+(?:\/\d*\.?\d+)?)(?:[a-z]{2,}(?:\^?[23])?|%|²|³)$/, '$1');
    s = s.replace(/^\+(?=\d)/, '');
    if (/^-?\d*\.?\d+$/.test(s)) return numCanon(parseFloat(s));
    var f = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
    if (f && parseFloat(f[2]) !== 0) return numCanon(parseFloat(f[1]) / parseFloat(f[2]));
    if (/^(no(real)?solutions?|none|∅|nosol)$/.test(s)) return 't:nosolution';
    if (/^(infinite(ly)?(many)?(solutions?)?|allrealnumbers|allreals|manysolutions)$/.test(s)) return 't:infinite';
    if (/^(one|1|exactlyone)solutions?$/.test(s)) return 't:onesolution';
    // tidy numbers inside text: 2.50<=y -> 2.5<=y
    s = s.replace(/\d*\.?\d+/g, function(n){ return String(parseFloat(n)); });
    return 't:' + s;
  }

  // One blank -> list of canonical pieces (for coordinates, systems, multiple answers)
  function pieces(raw){
    var s = String(raw == null ? '' : raw).trim();
    s = s.replace(/[−–—]/g, '-').replace(/[×·]/g, '*').replace(/÷/g, '/')
         .replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/≠/g, '!=');
    Object.keys(FRAC).forEach(function(g){ s = s.split(g).join(' ' + FRAC[g]); });
    s = s.trim();
    var wrapped = /^[\(\[\{].*[\)\]\}]$/.test(s) && !/[\(\)\[\]\{\}]/.test(s.slice(1, -1));
    if (wrapped) s = s.slice(1, -1);
    else s = s.replace(/\b\d{1,3}(,\d{3})+\b/g, function(x){ return x.replace(/,/g, ''); });
    var out = s.split(/,|\band\b/i).map(function(p){ return p.trim(); })
            .filter(function(p){ return p.length; }).map(canon);
    // "no, not similar" / "yes, they are similar" -> one answer
    if (out.length > 1 && out.every(function(p){ return p === out[0]; }) && /^t:(yes|no)$/.test(out[0])) out = [out[0]];
    return out;
  }

  // Teacher: "answer | alternate | alternate"  ->  [[hash,...], ...]
  function buildAlts(answer, salt){
    return String(answer).split('|').map(function(a){ return a.trim(); })
      .filter(function(a){ return a.length; })
      .map(function(a){ return pieces(a).map(function(p){ return hash(salt, p); }); })
      .filter(function(a){ return a.length; });
  }

  // Student: returns 'correct' | 'partial' | 'incorrect' | 'empty'
  function check(input, alts, salt, anyOrder){
    var mine = pieces(input).map(function(p){ return hash(salt, p); });
    if (!mine.length) return 'empty';
    var partial = false;
    if (anyOrder){
      var uniq = function(a){ return a.filter(function(h, i){ return a.indexOf(h) === i; }); };
      var m2 = uniq(mine);
      for (var k = 0; k < alts.length; k++){
        var a2 = uniq(alts[k]);
        var hit = m2.filter(function(h){ return a2.indexOf(h) > -1; }).length;
        if (hit === a2.length && m2.length === a2.length) return 'correct';
        if (hit > 0) partial = true;
      }
      return partial ? 'partial' : 'incorrect';
    }
    for (var i = 0; i < alts.length; i++){
      var alt = alts[i], right = 0;
      for (var j = 0; j < alt.length; j++) if (mine[j] === alt[j]) right++;
      if (right === alt.length && mine.length === alt.length) return 'correct';
      if (right > 0) partial = true;
      else if (alt.length > 1 && mine.some(function(h){ return alt.indexOf(h) > -1; })) partial = true;
    }
    return partial ? 'partial' : 'incorrect';
  }

  return { buildAlts: buildAlts, check: check, pieces: pieces };
})();
if (typeof module !== 'undefined') module.exports = HWC;
</script>

<script>
var CLASSES = [
  { id: 'regular', name: '8th Grade Math', short: 'Math 8', blurb: 'Regular 8th grade math', ic: '8' },
  { id: 'accelerated', name: '8th Grade Accelerated', short: 'Accelerated', blurb: 'Accelerated / Integrated Math I', ic: 'A' }
];
var params = new URLSearchParams(location.search);
var app = document.getElementById('app');
var ICON = {
  good: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>',
  part: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>',
  bad: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>',
  info: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5M10 6.2v.1" stroke-linecap="round"/></svg>'
};
var MSG = {
  correct:   ['r-good', ICON.good, 'Correct!'],
  partial:   ['r-part', ICON.part, 'Partly correct. Some of your answer is right — check your work.'],
  incorrect: ['r-bad',  ICON.bad,  'Not yet. Look back at your work and try again.'],
  empty:     ['r-empty',ICON.info, 'Fill in every blank first.']
};

function store(key, val){
  try {
    if (val === undefined){ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
    localStorage.setItem(key, JSON.stringify(val));
  } catch(e){ return null; }
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
function cls(id){ return CLASSES.find(function(x){ return x.id === id; }) || { id: id, name: id, short: id }; }

// Older data (one answer per problem) -> current format
function normProblem(p){
  if (p.parts) return p;
  return { n: p.label, q: '', note: p.note || '', parts: [{ pre: '', post: '', type: 'text', alts: p.alts }] };
}

/* ===================== STUDENT ===================== */
var S = { data: null, cls: null, hw: null, preview: false };

function startStudent(data, preview){
  S.data = data; S.preview = !!preview;
  var pre = params.get('class');
  S.cls = (pre && data && data.classes && data.classes[pre]) ? pre : (store('hwc-class') || null);
  if (S.cls && !(data && data.classes && data.classes[S.cls])) S.cls = null;
  S.hw = null;
  render();
}
function render(){
  app.innerHTML = '';
  document.getElementById('who').textContent = S.cls ? cls(S.cls).name : '';
  window.scrollTo(0, 0);
  if (S.preview){
    var bar = el('<div class="previewbar"><span>Preview — this is what students see.</span><button class="btn small">Back to teacher</button></div>');
    bar.querySelector('button').onclick = function(){ startTeacher(); };
    app.appendChild(bar);
  }
  if (!S.data || !S.data.classes){
    app.appendChild(el('<div class="card empty">No homework has been posted yet. Check back soon.</div>'));
    return;
  }
  if (!S.cls) return pickClass();
  if (!S.hw) return pickHW();
  showHW();
}
function pickClass(){
  app.appendChild(el('<h1>Which class are you in?</h1>'));
  app.appendChild(el('<p class="lead">Check your homework answers before you turn them in.</p>'));
  var g = el('<div class="choices"></div>');
  CLASSES.forEach(function(c){
    var b = el('<button class="choice"><div class="ic">' + esc(c.ic) + '</div><div><strong>' + esc(c.name) + '</strong><span>' + esc(c.blurb) + '</span></div><div class="go">›</div></button>');
    b.onclick = function(){ S.cls = c.id; store('hwc-class', c.id); render(); };
    g.appendChild(b);
  });
  app.appendChild(g);
}
function pickHW(){
  var c = cls(S.cls);
  var crumbs = el('<div class="crumbs"><button>← Change class</button></div>');
  crumbs.querySelector('button').onclick = function(){ S.cls = null; store('hwc-class', ''); render(); };
  app.appendChild(crumbs);
  app.appendChild(el('<h1>Pick your homework</h1>'));
  app.appendChild(el('<p class="lead">' + esc(c.name) + '</p>'));
  var list = (S.data.classes[S.cls] || []).slice().sort(function(a, b){ return b.num - a.num; });
  if (!list.length){ app.appendChild(el('<div class="card empty">No homework posted for this class yet.</div>')); return; }
  var g = el('<div class="choices"></div>');
  list.forEach(function(hw){
    var sub = [hw.title, hw.due ? 'Due ' + hw.due : ''].filter(Boolean).join(' · ') || (hw.problems.length + ' problems');
    var b = el('<button class="choice"><div class="ic">#' + esc(hw.num) + '</div><div><strong>Homework #' + esc(hw.num) + '</strong><span>' + esc(sub) + '</span></div><div class="go">›</div></button>');
    b.onclick = function(){ S.hw = hw; render(); };
    g.appendChild(b);
  });
  app.appendChild(g);

function checkProblem(p, vals, salt){
  var each = p.parts.map(function(part, j){ return HWC.check(vals[j] || '', part.alts, salt, part.order === 'any'); });
  if (each.some(function(r){ return r === 'empty'; })) return { overall: 'empty', each: each };
  if (each.every(function(r){ return r === 'correct'; })) return { overall: 'correct', each: each };
  if (each.some(function(r){ return r === 'correct' || r === 'partial'; })) return { overall: 'partial', each: each };
  return { overall: 'incorrect', each: each };
}

function showHW(){
  var hw = S.hw, c = cls(S.cls), salt = S.cls + '-' + hw.id;
  var problems = hw.problems.map(normProblem);
  var saveKey = 'hwc2-' + salt;
  var saved = store(saveKey) || {};
  var status = {};

  var crumbs = el('<div class="crumbs"><button data-a="c">' + esc(c.short) + '</button><span class="sep">/</span><button data-a="h">All homework</button><span class="sep">/</span><span>#' + esc(hw.num) + '</span></div>');

  crumbs.querySelector('[data-a=h]').onclick = function(){ S.hw = null; render(); };

  app.appendChild(el('<div class="hwhead"><div><h1>Homework #' + esc(hw.num) + (hw.title ? ' · ' + esc(hw.title) : '') + '</h1>' +
    '<div class="meta">' + esc(c.name) + (hw.due ? ' · Due ' + esc(hw.due) : '') + ' · ' + problems.length + ' problems</div></div></div>'));
  app.appendChild(el('<div class="howto">' + ICON.info.replace('<svg', '<svg style="width:20px;height:20px;flex:none;margin-top:1px"') +
    '<div>Do the work on your paper first. Then type your answer and press <b>Check</b>. You will see if it is right — not the answer. ' +
    'Fractions (<b>3/4</b>) and decimals (<b>0.75</b>) both work.</div></div>'));

  var prog = el('<div class="progress"><div class="pbar"><i class="g" style="background:var(--good)"></i><i class="p" style="background:var(--part)"></i><i class="b" style="background:var(--bad)"></i></div><div class="ptext"></div></div>');
  app.appendChild(prog);

  problems.forEach(function(p, i){
    var card = el('<section class="card prob" id="q' + i + '">' +
      '<div class="ptop"><div class="num">' + esc(p.n) + '</div><p class="q">' + esc(p.q || 'Problem ' + p.n) + '</p></div>' +
      (p.img ? '<div class="fig"><img alt="Figure for problem ' + esc(p.n) + '" src="' + p.img + '"></div>' : '') +
      '<div class="answers"></div>' +
      (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') +
      (p.parts.length ? '<div class="foot"><button class="btn">Check</button><div class="result" role="status" aria-live="polite"></div></div>'
        : '<div class="note paper">' + ICON.info.replace('<svg', '<svg style="width:16px;height:16px;vertical-align:-3px;margin-right:4px"') + 'Answer this one on your paper. It is checked in class.</div>') +
    '</section>');
    var box = card.querySelector('.answers'), res = card.querySelector('.result');
    var vals = p.parts.map(function(_, j){ return saved[i + '-' + j] || ''; });
    var blanks = [];

    function changed(j, v){
      vals[j] = v; saved[i + '-' + j] = v; store(saveKey, saved);
      res.className = 'result'; blanks.forEach(function(b){ b.classList.remove('ok', 'no'); });
      delete status[i]; updateProgress();
    }
    p.parts.forEach(function(part, j){
      var b;
      if (part.type === 'choice' || part.options){
        var opts = part.options || ['Yes', 'No'];
        b = el('<div class="blank">' + (part.pre ? '<span class="pre">' + esc(part.pre) + '</span>' : '') + '<div class="seg" role="group"></div>' + (part.post ? '<span class="post">' + esc(part.post) + '</span>' : '') + '</div>');
        var seg = b.querySelector('.seg');
        opts.forEach(function(o){
          var ob = el('<button type="button">' + esc(o) + '</button>');
          if (vals[j] === o) ob.classList.add('on');
          ob.onclick = function(){
            seg.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
            ob.classList.add('on'); changed(j, o);
          };
          seg.appendChild(ob);
        });
      } else {
        b = el('<label class="blank">' + (part.pre ? '<span class="pre">' + esc(part.pre) + '</span>' : '') +
          '<input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"' + (part.pre && part.pre.length > 10 ? ' class="wide"' : '') + ' aria-label="' + esc((part.pre || 'Answer') + ' problem ' + p.n) + '">' +
          (part.post ? '<span class="post">' + esc(part.post) + '</span>' : '') + '</label>');
        var inp = b.querySelector('input');
        inp.value = vals[j];
        inp.addEventListener('input', function(){ changed(j, inp.value); });
        inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') run(); });
      }
      blanks.push(b); box.appendChild(b);
    });

    function run(){
      var r = checkProblem(p, vals, salt);
      var m = MSG[r.overall];
      res.className = 'result show ' + m[0];
      res.innerHTML = m[1] + '<span>' + m[2] + '</span>';
      blanks.forEach(function(b, j){
        b.classList.remove('ok', 'no');
        if (r.overall !== 'empty' && p.parts.length > 1) b.classList.add(r.each[j] === 'correct' ? 'ok' : 'no');
      });
      if (r.overall !== 'empty') status[i] = r.overall; else delete status[i];
      updateProgress();
    }
    if (p.parts.length) card.querySelector('.btn').onclick = run;
    card._run = run; card._filled = function(){ return vals.some(function(v){ return String(v).trim(); }); };
    app.appendChild(card);
  });

  var bottom = el('<div class="bottom"><button class="btn" data-a="all">Check all</button><button class="btn ghost" data-a="clr">Clear my answers</button></div>');
  bottom.querySelector('[data-a=all]').onclick = function(){
    app.querySelectorAll('.prob').forEach(function(c){ if (c._filled()) c._run(); });
  };
  bottom.querySelector('[data-a=clr]').onclick = function(){
    if (!confirm('Clear all your answers for this homework?')) return;
    store(saveKey, {}); render();
  };
  app.appendChild(bottom);

  function updateProgress(){
    var n = problems.filter(function(p){ return p.parts.length; }).length || 1, g = 0, pt = 0, b = 0;
    Object.keys(status).forEach(function(k){ if (status[k] === 'correct') g++; else if (status[k] === 'partial') pt++; else b++; });
    prog.querySelector('.g').style.width = (g / n * 100) + '%';
    prog.querySelector('.p').style.width = (pt / n * 100) + '%';
    prog.querySelector('.b').style.width = (b / n * 100) + '%';
    prog.querySelector('.ptext').innerHTML =
      '<span><b>' + g + ' of ' + n + '</b> correct</span>' +
      (pt ? '<span><i class="dot" style="background:var(--part)"></i>' + pt + ' partly</span>' : '') +
      (b ? '<span><i class="dot" style="background:var(--bad)"></i>' + b + ' not yet</span>' : '') +
      (n - g - pt - b ? '<span><i class="dot" style="background:var(--line2)"></i>' + (n - g - pt - b) + ' not checked</span>' : '');
  }
  updateProgress();
}

// "x = 25; ∠A = 50°; no" -> blanks
function smartParts(ans){
  return String(ans).split(';').map(function(s){ return s.trim(); }).filter(Boolean).map(function(s){
    var post = /°\s*$/.test(s) ? '°' : '';
    s = s.replace(/°\s*$/, '');
    var m = s.match(/^((?:m?∠\s*[A-Za-z]{1,3})|[a-z]|(?:\(?[^=]{1,20}\)?°?))\s*=\s*(.+)$/);
    if (/^(yes|no)\b/i.test(s)) return { pre: '', post: '', type: 'choice', answer: /^yes/i.test(s) ? 'Yes' : 'No' };
    if (m){
      var pre = m[1].trim(); if (/^∠/.test(pre)) pre = 'm' + pre;
      return { pre: pre + ' =', post: post, type: 'text', answer: m[2].trim() };
    }
    return { pre: '', post: post, type: 'text', answer: s };
  });
}
function parseKey(text){
  var out = [];
  String(text).split(/\r?\n/).forEach(function(line){
    var l = line.trim(); if (!l) return;
    var m = l.match(/^(?:#|problem|prob\.?|q|question)?\s*(\d+\s*[a-z]?)\s*[\.\):\-]\s*(.+)$/i);
    if (m) out.push({ n: m[1].replace(/\s+/g, ''), q: '', img: '', note: '', parts: smartParts(m[2].replace(/^(answer|ans)\s*[:\-]\s*/i, '')) });
  });
  return out;
}
function loadMammoth(){
  return new Promise(function(res, rej){
    if (window.mammoth) return res(window.mammoth);
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
    s.onload = function(){ res(window.mammoth); }; s.onerror = rej;
    document.head.appendChild(s);
  });
}
function imageToDataURL(file, cb){
  var rd = new FileReader();
  rd.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 640, sc = Math.min(1, max / img.width);
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/png'));
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

    hw.problems.push({ n: String(last + 1), q: '', img: '', note: '', parts: [{ pre: '', post: '', type: 'text', answer: '' }] });

  app.appendChild(card);

function buildPublished(){
  var out = { version: 2, updated: new Date().toISOString(), classes: {} };
  CLASSES.forEach(function(c){
    out.classes[c.id] = T.classes[c.id].filter(function(h){ return !h.hidden; })
      .sort(function(a, b){ return a.num - b.num; })
      .map(function(h){
        var salt = c.id + '-' + h.id;
        return { id: h.id, num: h.num, title: h.title || '', due: h.due || '',
          problems: h.problems.map(function(p){
            var parts = p.parts.filter(function(x){ return String(x.answer || '').trim(); }).map(function(x){
              var ty = TYPES[x.type] || TYPES.text;
              var o = { pre: x.pre || '', post: x.post || '', type: ty.options ? 'choice' : 'text', alts: HWC.buildAlts(x.answer, salt) };
              if (ty.options) o.options = ty.options;
              if (ty.order) o.order = ty.order;
              return o;
            });
            var o = { n: p.n, q: p.q || '', parts: parts };
            if (p.img) o.img = p.img; if (p.note) o.note = p.note;
            return o;
          }).filter(function(p){ return p.parts.length || p.q; }) };
      });
  });
  return out;
}
function download(name, text, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function renderPublish(){
  var card = el('<div class="card pad"><h2>Publish to students</h2>' +
    '<p class="muted">Download <b>homework.js</b> and upload it to GitHub, replacing the old one. The answers inside are scrambled.</p>' +
    '<div class="row"><button class="btn" id="pub">Download homework.js</button><button class="btn ghost" id="prev">Preview as student</button></div>' +
    '<hr class="sep"><p class="muted">Your answer keys are saved in this browser only. Keep a backup.</p>' +
    '<div class="row"><button class="btn small ghost" id="bak">Download backup</button><label class="btn small ghost" style="cursor:pointer">Load backup<input type="file" id="load" accept=".json" hidden></label></div></div>');
  card.querySelector('#pub').onclick = function(){
    download('homework.js', '// Homework Checker data — made in teacher mode. Answers are hashed.\nwindow.HOMEWORK_DATA = ' + JSON.stringify(buildPublished()) + ';\n', 'text/javascript');
  };
  card.querySelector('#prev').onclick = function(){ startStudent(buildPublished(), true); };
  card.querySelector('#bak').onclick = function(){ download('homework-answer-keys-backup.json', JSON.stringify(T, null, 2), 'application/json'); };
  card.querySelector('#load').onchange = function(e){
    var file = e.target.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var d = JSON.parse(rd.result); if (!d.classes) throw 0;
        if (!confirm('Replace the answer keys in this browser with this backup?')) return;
        CLASSES.forEach(function(c){ d.classes[c.id] = d.classes[c.id] || []; });
        T = d; saveT(); tS.editing = null; startTeacher();
      } catch(err){ alert("That doesn't look like a Homework Checker backup."); }
    };
    rd.readAsText(file); e.target.value = '';
  };
  app.appendChild(card);
}

/* ===================== START ===================== */
if (params.has('teacher')) startTeacher();
else startStudent(window.HOMEWORK_DATA || null, false);
</script>
